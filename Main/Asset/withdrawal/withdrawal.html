<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Withdraw</title>
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #161b22;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(255, 50, 50, 0.3), 0 6px 10px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    select, input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #30363d;
      background-color: #0d1117;
      color: #c9d1d9;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff7b72;
    }

    button {
      margin-top: 2rem;
      width: 100%;
      padding: 0.8rem;
      background-color: #da3633;
      border: none;
      color: white;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #e5534b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Withdraw Crypto</h2>

    <label for="coin">Select Coin</label>
    <select id="coin">
      <option>Loading...</option>
    </select>

    <label for="qty">Quantity</label>
    <input type="number" id="qty" min="0" placeholder="Enter quantity" />

    <label for="rcvr">Receiver Address</label>
    <input type="text" id="rcvr" placeholder="Enter destination wallet address" />

    <button onclick="submitWithdraw()">Submit Withdrawal</button>
  </div>

  <script>
    const email = localStorage.getItem("userEmail");
    const coinSelect = document.getElementById("coin");

    async function loadAssets() {
      const res = await fetch(`get_assets.php?email=${email}`);
      const data = await res.json();

      coinSelect.innerHTML = "";

      if (data.length === 0) {
        const opt = document.createElement("option");
        opt.text = "No assets found";
        opt.disabled = true;
        coinSelect.appendChild(opt);
        return;
      }

      data.forEach(asset => {
        const opt = document.createElement("option");
        opt.value = asset.coin;
        opt.textContent = `${asset.coin} (Qty: ${asset.quantity})`;
        coinSelect.appendChild(opt);
      });
    }

    function submitWithdraw() {
      const coin = document.getElementById("coin").value;
      const qty = parseFloat(document.getElementById("qty").value);
      const rcvr = document.getElementById("rcvr").value.trim();

      if (!coin) return alert("Select a coin.");
      if (isNaN(qty) || qty <= 0) return alert("Enter valid quantity.");
      if (!rcvr) return alert("Receiver address required.");
      if (!email) return alert("Please login again.");

      const formData = new FormData();
      formData.append("email", email);
      formData.append("coin", coin);
      formData.append("qty", qty);
      formData.append("rcvr", rcvr);
      formData.append("chn", "BSC");

      fetch("withdrawal.php", {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        window.history.back();
      })
      .catch(err => alert("Error: " + err));
    }

    window.addEventListener("DOMContentLoaded", loadAssets);
  </script>
</body>
</html>
