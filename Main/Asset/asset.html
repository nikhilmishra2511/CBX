<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBX Asset Dashboard</title>
  <style>
    /* [Same CSS as before, unchanged] */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    ul, li {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    body, html {
      height: 100%;
      background: linear-gradient(135deg, #121212, #1e1e1e, #2c2c2c);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
      color: #ffffff;
      overflow-x: hidden;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 20px;
      color: #00ffe0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
    }

    .total-assets {
      font-size: 1.5rem;
    }

    .btn-group button {
      background-color: #03a9f4;
      border: none;
      border-radius: 10px;
      color: white;
      padding: 12px 26px;
      margin-left: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 0 12px rgba(3, 169, 244, 0.4);
      transition: transform 0.3s ease, filter 0.3s, box-shadow 0.3s;
    }

    .btn-group button:hover {
      transform: scale(1.1);
      filter: brightness(85%);
      box-shadow: 0 0 18px rgba(3, 169, 244, 0.6);
    }

    .currency-dropdown {
      position: relative;
      display: inline-block;
    }

    .currency-list {
      display: none;
      position: absolute;
      background-color: #222;
      min-width: 150px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      z-index: 2;
    }

    .currency-list li {
      padding: 10px;
      cursor: pointer;
      color: #f0f0f0;
      transition: background 0.3s;
    }

    .currency-list li:hover {
      background-color: #444;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      margin-top: 30px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(3, 218, 197, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      color: #00ffe0;
    }

    #transactionList {
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>CBX Asset Dashboard</h1>

  <div class="top-bar">
    <div class="total-assets">
      Total Assets: <span id="totalAssets">--</span> <span id="selectedCurrency">USDT</span>
    </div>

    <div class="btn-group">
      <button onclick="navigateTo('deposit')">Deposit</button>
      <button onclick="navigateTo('withdrawal')">Withdraw</button>
      <button onclick="navigateTo('transaction')">Transactions</button>

      <div class="currency-dropdown">
        <button onclick="toggleCurrencyList()">Currency</button>
        <ul id="currencyList" class="currency-list">
          <li onclick="convertTo('USDT')">USDT</li>
          <li onclick="convertTo('INR')">INR</li>
          <li onclick="convertTo('BTC')">BTC</li>
          <li onclick="convertTo('EUR')">EUR</li>
          <li onclick="convertTo('USD')">USD</li>
          <li onclick="convertTo('JPY')">JPY</li>
          <li onclick="convertTo('GBP')">GBP</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="card" id="assetTable">
    <h2>Your Crypto Holdings</h2>
    <div style="text-align:center;">Loading...</div>
  </div>

  <div class="card" id="transactionList" style="display:none;">
    <h2>Transaction History</h2>
  </div>
</div>

<script>
  const email = localStorage.getItem("userEmail");
  let prices = {};          // e.g. { BTCUSDT: 67000.5 }
  let assetData = [];
  let totalUSDT = 0;
  let currentCurrency = 'USDT';

  if (!email) alert("No email found in localStorage!");

  // Same coin list as the dashboard (symbol, name) so every coin maps to the right trading pair
  const COINS = [
    ["btcusdt","Bitcoin"],
    ["ethusdt","Ethereum"],
    ["bnbusdt","BNB"],
    ["xrpusdt","XRP"],
    ["solusdt","Solana"],
    ["adausdt","Cardano"],
    ["dogeusdt","Dogecoin"],
    ["tonusdt","Ton"],
    ["ltcusdt","Litecoin"],
    ["dotusdt","Polkadot"],
    ["suiusdt","Sui"],
    ["trxusdt","TRON"],
    ["avaxusdt","Avalanche"],
    ["uniusdt","Uniswap"],
    ["linkusdt","Chainlink"],
    ["slfusdt","SLF"],
    ["trumpusdt","TRUMP"],
    ["wctusdt","WalletConnect"],
    ["wifusdt","DogWifHat"],
    ["nxpcusdt","NexPace"],
    ["sxtusdt","Space and Time"],
    ["nexousdt","NEXO"],
    ["solvusdt","Solv Protocol"],
    ["trbusdt","Tellor Tributes"],
    ["phausdt","Phala Network"],
    ["actusdt","Act I : The AI Prophecy"],
    ["pnutusdt","Peanut the Squirrel"],
    ["algousdt","Algorand"],
    ["filusdt","FileCoin"],
    ["qtumusdt","QTUM"],
    ["vanausdt","VANA"],
    ["opusdt","Optimism"],
    ["jupusdt","Jupiter"],
    ["lumiausdt","LUMIA"],
    ["initusdt","Initia"],
    ["portalusdt","Portal"],
    ["catiusdt","Catizen"],
    ["bmtusdt","Bubblemaps"],
    ["flmusdt","Flamingo"],
    ["omusdt","Mantra"],
    ["santosusdt","SANTOS FC FAN TOKEN"],
    ["alpineusdt","ALPINE F1 FAN TOKEN"],
    ["formusdt","FOUR"],
    ["superusdt","SuperVerse"],
    ["epicusdt","Epic Chain"],
    ["zecusdt","Zcash"],
    ["dashusdt","Dash"],
    ["dcrusdt","Decred"],
    ["ksmusdt","Kusama"],
    ["aaveusdt","Aave"],
    ["wbethusdt","Wrapped Beacon ETH"],
    ["wldusdt","WorldCoin"],
    ["taousdt","Bittensor"],
    ["aptusdt","Aptos"],
    ["nearusdt","Near Protocol"],
    ["icpusdt","Internet Computer"],
    ["arbusdt","Arbitrum"],
    ["renderusdt","Render"],
    ["virtualusdt","Virtuals Protocol"],
    ["tiausdt","Celestia"],
    ["enausdt","Ethena"],
    ["atomusdt","Cosmos"],
    ["mkrusdt","Maker"],
    ["bnsolusdt","Binance Staked SOL"],
    ["rayusdt","Raydium"],
    ["jtousdt","JITO"],
    ["dexeusdt","DeXe"],
    ["qntusdt","Quant"],
    ["injusdt","Injective"],
    ["stxusdt","Stacks"],
    ["pendleusdt","Pendle"],
    ["paxgusdt","PAX Gold"],
    ["cakeusdt","PanCakeSwap"],
    ["runeusdt","ThorChain"],
    ["axsusdt","Axie Infinity"],
    ["ethfiusdt","Ether.Fi"],
    ["xtzusdt","Tezos"],
    ["neousdt","NEO"],
    ["flowusdt","Flow"],
    ["zrousdt","LayerZero"],
    ["apeusdt","ApeCoin"],
    ["kaitousdt","Kaito"],
    ["egldusdt","MultiversX"],
    ["compusdt","Compound"],
    ["gnousdt","Gnosis"],
    ["lptusdt","Livepeer"],
    ["maskusdt","Mask Network"],
    ["sfpusdt","SafePal"],
    ["snxusdt","Synthetix"],
    ["layerusdt","SoLayer"],
    ["gasusdt","GAS"],
    ["ordiusdt","ORDI"],
    ["yfiusdt","Yearn.Finance"],
    ["orcausdt","Orca"],
    ["gmxusdt","GMX"],
    ["xnousdt","NANO"],
    ["ilvusdt","Illuvium"],
    ["metisusdt","METIS"],
    ["ssvusdt","SSV.Network"],
    ["auctionusdt","Auction"],
    ["gnsusdt","Gains Network"],
    ["psgusdt","Paris Saint-Germain Fan Token"],
    ["scrusdt","Scroll"],
    ["movrusdt","MoonRiver"],
    ["ntrnusdt","Neutron"]
  ];
  const SYMBOL_BY_KEY = {};
  COINS.forEach(([sym, name]) => {
    const pair = sym.toUpperCase();
    SYMBOL_BY_KEY[name.toUpperCase()] = pair;                 // "BITCOIN"  -> BTCUSDT
    SYMBOL_BY_KEY[pair.replace(/USDT$/, '')] = pair;          // "BTC"      -> BTCUSDT
  });

  function getBinanceSymbol(coin) {
    const upper = coin.trim().toUpperCase();
    if (upper === 'USDT') return 'USDT';                      // USDT itself needs no pair
    return SYMBOL_BY_KEY[upper] || (upper + 'USDT');
  }

  // USDT is always worth 1 USDT; everything else comes from the price table
  function priceOf(coin) {
    const pair = getBinanceSymbol(coin);
    if (pair === 'USDT') return 1;
    return prices[pair] || 0;
  }

  // ---------------------------------------------------------------------
  // Prices: Binance (several hosts in parallel), CryptoCompare as backup
  // when Binance is blocked on the network.
  // ---------------------------------------------------------------------
  const REST_HOSTS = [
    'https://data-api.binance.vision',
    'https://api.binance.com',
    'https://api1.binance.com',
    'https://api.binance.us'
  ];
  let binanceDownUntil = 0;

  function fetchJson(url, ms = 6000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .finally(() => clearTimeout(timer));
  }

  async function loadPrices() {
    const wanted = new Set(assetData.map(a => getBinanceSymbol(a.coin)).filter(p => p !== 'USDT'));
    wanted.add('BTCUSDT'); // needed for the BTC currency conversion

    if (Date.now() > binanceDownUntil) {
      try {
        const all = await Promise.any(REST_HOSTS.map(h => fetchJson(`${h}/api/v3/ticker/price`, 6000)));
        all.forEach(t => { if (wanted.has(t.symbol)) prices[t.symbol] = parseFloat(t.price); });
      } catch (e) {
        console.warn('Binance unreachable, using CryptoCompare', e);
        binanceDownUntil = Date.now() + 5 * 60 * 1000;
      }
    }

    // Anything still missing (Binance blocked, or coin not listed there)
    const missing = [...wanted].filter(p => !prices[p]);
    for (let i = 0; i < missing.length; i += 40) {
      const chunk = missing.slice(i, i + 40);
      const bases = chunk.map(p => p.replace(/USDT$/, ''));
      try {
        const j = await fetchJson(
          `https://min-api.cryptocompare.com/data/pricemulti?fsyms=${bases.join(',')}&tsyms=USD`, 10000);
        bases.forEach(b => { if (j[b] && j[b].USD) prices[b + 'USDT'] = j[b].USD; });
      } catch (e) {
        console.warn('CryptoCompare price fetch failed', e);
      }
    }
  }

  // ---------------------------------------------------------------------
  // Assets from the database, then prices, then draw
  // ---------------------------------------------------------------------
  let busy = false;
  async function fetchAssets() {
    if (busy || !email) return;
    busy = true;
    try {
      const res = await fetch(`get_assets.php?email=${encodeURIComponent(email)}`);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) { throw new Error('get_assets.php did not return JSON: ' + text.slice(0, 200)); }
      if (!Array.isArray(data)) throw new Error('Unexpected response: ' + text.slice(0, 200));
      console.log("📦 Fetched asset data:", data);
      assetData = data;
      renderAssets();          // show balances (USDT is valued instantly)
      await loadPrices();
      renderAssets();          // re-draw with live prices
    } catch (err) {
      console.error("❌ Fetch error:", err);
      document.getElementById("assetTable").innerHTML =
        `<h2>Your Crypto Holdings</h2><div style="text-align:center;color:#ff6b6b;">Could not load assets: ${err.message}</div>`;
    } finally {
      busy = false;
    }
  }

  function renderAssets() {
    if (!assetData.length) {
      document.getElementById("assetTable").innerHTML =
        `<h2>Your Crypto Holdings</h2><div style="text-align:center;">No assets yet.</div>`;
      document.getElementById("totalAssets").innerText = (0).toFixed(4);
      document.getElementById("selectedCurrency").innerText = currentCurrency;
      return;
    }

    let html = `<table><tr><th>Coin</th><th>Quantity</th><th>Price (USDT)</th><th>Value (${currentCurrency})</th></tr>`;
    totalUSDT = 0;

    assetData.forEach(asset => {
      const coin = asset.coin.trim();
      const price = priceOf(coin);
      const value = parseFloat(asset.quantity) * price;
      totalUSDT += value;

      const converted = convertAmount(value, currentCurrency);
      html += `<tr>
        <td>${coin}</td>
        <td>${asset.quantity}</td>
        <td>${price ? price.toFixed(4) : 'N/A'}</td>
        <td>${price ? converted.toFixed(4) : 'N/A'}</td>
      </tr>`;
    });

    html += '</table>';
    document.getElementById("assetTable").innerHTML = `<h2>Your Crypto Holdings</h2>${html}`;
    document.getElementById("totalAssets").innerText = convertAmount(totalUSDT, currentCurrency).toFixed(4);
    document.getElementById("selectedCurrency").innerText = currentCurrency;
  }

  function convertAmount(usdt, currency) {
    const rates = {
      USDT: 1,
      INR: 83,
      BTC: 1 / (prices['BTCUSDT'] || 1),
      EUR: 0.92,
      USD: 1,
      JPY: 157,
      GBP: 0.79,
    };
    return usdt * (rates[currency] || 1);
  }

  function toggleCurrencyList() {
    const list = document.getElementById("currencyList");
    list.style.display = list.style.display === "block" ? "none" : "block";
  }

  function convertTo(currency) {
    currentCurrency = currency;
    renderAssets();
    document.getElementById("currencyList").style.display = "none";
  }

  function navigateTo(page) {
    window.location.href = `${page}/${page}.html`;
  }

  // Fetch once and then every 5s
  fetchAssets();
  setInterval(fetchAssets, 5000);

</script>

</body>
</html>
