<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBX Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    body {
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    video.bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.3);
    }

    h2 {
      color: #00ffc8;
      margin-top: 30px;
    }

    .container {
      border-radius: 10px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      margin-top: 20px;
    }

    .field {
      margin: 15px 0;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }

    input[readonly] {
      background-color: #222;
      color: #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #00ffc8;
      border: none;
      color: #0a0a0a;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    .password-field {
      position: relative;
    }

    .toggle-eye {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #ccc;
    }

    #profile-pic-preview {
      width: 360px;
      height: 250px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #00ffc8;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- 🎥 Background Video -->
  <video autoplay muted loop class="bg-video">
    <source src="bg.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <img id="profile-pic-preview" src="" alt="Profile Picture" />
  <h2>Your Profile</h2>

  <div class="container">
    <div class="field">
      <label>Email</label>
      <input type="text" id="email" readonly />
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="name" readonly />
    </div>
    <div class="field">
      <label>Password</label>
      <div class="password-field">
        <input type="password" id="password" readonly />
        <span class="toggle-eye" onclick="togglePassword()">👁️</span>
      </div>
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="+91..." maxlength="13" />
    </div>
    <div class="field">
      <label>Address</label>
      <input type="text" id="address" />
    </div>
    <div class="field">
      <label>Country</label>
      <input type="text" id="country" />
    </div>
    <div class="field">
      <label>Date of Birth</label>
      <input type="date" id="dob" onchange="calculateAge()" />
    </div>
    <div class="field">
      <label>Age</label>
      <input type="text" id="age" readonly />
    </div>
    <div class="field">
      <label>Upload Profile Picture</label>
      <input type="file" id="profilePic" accept="image/*" onchange="previewPic(event)" />
    </div>
    <button onclick="saveProfile()">Save Profile</button>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    const email = localStorage.getItem("userEmail");
    if (!email) {
      alert("User not logged in");
      window.location.href = "../../intro.html";
    }
    document.getElementById("email").value = email;

    fetch("get_user.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `email=${encodeURIComponent(email)}`
    })
    .then(res => res.json())
    .then(data => {
      if (!data) return;
      document.getElementById("name").value = data.username || "";
      document.getElementById("password").value = data.password || "";
      document.getElementById("phone").value = data.phone || "+91";
      document.getElementById("address").value = data.address || "";
      document.getElementById("country").value = data.country || "";
      document.getElementById("dob").value = data.dob || "";
      document.getElementById("age").value = data.age || "";
      if (data.profilePic) {
        document.getElementById("profile-pic-preview").src = data.profilePic;
      }
    });

    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }

    function calculateAge() {
      const dob = new Date(document.getElementById("dob").value);
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
      document.getElementById("age").value = age;
    }

    function previewPic(event) {
      const reader = new FileReader();
      reader.onload = function () {
        document.getElementById("profile-pic-preview").src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }


    function saveProfile() {
      const phone = document.getElementById("phone").value;
      const address = document.getElementById("address").value;
      const country = document.getElementById("country").value;
      const dob = document.getElementById("dob").value;
      const age = document.getElementById("age").value;
      const profilePic = document.getElementById("profile-pic-preview").src;

      const phonePattern = /^\+91\d{10}$/;
      if (!phonePattern.test(phone)) {
        alert("Phone number must start with +91 and contain 10 digits only.");
        return;
      }

      fetch("save_profile.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, phone, address, country, dob, age, profilePic })
      })
      .then(res => res.text())
      .then(msg => alert(msg));
    }

    function logout() {
    localStorage.clear();
    window.location.replace("../../intro.html"); // Better than href for logout
  }
  </script>
</body>
</html>
