<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CBX Trade</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    h2 {
      color: #00ffc8;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
      font-size: 18px;
      gap: 20px;
    }

    .info p {
      margin: 0;
    }

    #price {
      font-size: 26px;
      color: #00ffc8;
      font-weight: bold;
    }

    .timeframe-buttons {
      margin-bottom: 15px;
      display: flex;
      gap: 8px;
    }

    .timeframe-buttons button {
      padding: 8px 12px;
      background: #181818;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .timeframe-buttons button:hover {
      background: #00ffc8;
      color: #0a0a0a;
    }

    .timeframe-buttons button.active {
      background: #00ffc8;
      color: #0a0a0a;
      font-weight: bold;
    }

    #chart {
      position: relative;
      width: 100%;
      height: 500px;
      margin-bottom: 30px;
      border: 1px solid #222;
      border-radius: 6px;
    }

    .below-chart {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 100%;
    }

    .trade-form, .coin-info {
      flex: 1;
      min-width: 300px;
      background: #111;
      padding: 20px;
      border-radius: 6px;
      font-size: 16px;
    }

    .trade-form h3, .coin-info h3 {
      color: #00ffc8;
      margin-top: 0;
      font-size: 22px;
      margin-bottom: 15px;
    }

    .trade-form label {
      display: block;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .trade-form input, .trade-form select {
      padding: 10px;
      margin-top: 5px;
      width: 100%;
      border-radius: 4px;
      border: 1px solid #333;
      background: #181818;
      color: #eee;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    /* small input for USDT amount */
.trade-form .small-input {
 padding: 10px;
      margin-top: 5px;
      width: 100%;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #333;
      background: #181818;
      color: #eee;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease;
}


    .trade-form input:focus, .trade-form select:focus {
      border-color: #00ffc8;
    }

    .trade-form button {
      margin-top: 15px;
      padding: 12px;
      background: #00ffc8;
      border: none;
      color: #0a0a0a;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
      width: 100%;
    }

    .trade-form button:hover {
      background: #00e6b4;
    }

    #tradeResult {
      margin-top: 18px;
      font-size: 15px;
      color: #ccc;
      line-height: 1.5;
    }

    .coin-info p {
      font-size: 15px;
      margin: 8px 0;
    }

    @media (max-width: 900px) {
      .below-chart {
        flex-direction: column;
      }

      #chart {
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <h2 id="title">Trade</h2>

  <div class="info">
    <p><strong>Symbol:</strong> <span id="symbol"></span></p>
    <p><strong>Live Price:</strong> <span id="price">Loading...</span></p>
  </div>

  <div class="timeframe-buttons">
    <button onclick="changeTimeframe('15m')" class="active">15m</button>
    <button onclick="changeTimeframe('30m')">30m</button>
    <button onclick="changeTimeframe('1h')">1h</button>
    <button onclick="changeTimeframe('12h')">12h</button>
    <button onclick="changeTimeframe('1d')">1d</button>
  </div>

  <div id="chart"></div>

  <!-- Below chart: Place Order + Coin Info -->
  <div class="below-chart">
    <!-- Order Form -->
    <div class="trade-form">
      <h3>Place Order</h3>
      <label>
        USDT Amount:
        <input type="number" id="usdtAmount" placeholder="Enter USDT amount" class="small-input" />
      </label>
      <label>
        Action:
        <select id="tradeAction">
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
        </select>
      </label>
      <button onclick="placeOrder()">Place Order</button>
      <p id="tradeResult"></p>
    </div>

    <!-- Coin Info -->
    <div class="coin-info">
      <h3>Coin Info</h3>
      <p><strong>ATH:</strong> <span id="ath">Loading...</span></p>
      <p><strong>ATL:</strong> <span id="atl">Loading...</span></p>
      <p><strong>Market Cap:</strong> <span id="marketCap">Loading...</span></p>
      <p><strong>Supply:</strong> <span id="supply">Loading...</span></p>
    </div>
  </div>

  <script>
    const tradeData = JSON.parse(localStorage.getItem("tradeData"));
    const email = localStorage.getItem("userEmail");

    // Only the coin is needed to show price + chart; email is only needed when placing an order
    if (!tradeData) {
      document.getElementById("title").textContent = "No coin selected. Go back and click Buy or Sell on a coin.";
      throw new Error("Missing data");
    }

    const symbol = tradeData.symbol.toLowerCase();
    document.getElementById("title").textContent = `${tradeData.action.toUpperCase()} ${tradeData.name}`;
    document.getElementById("symbol").textContent = symbol.toUpperCase();

    // Chart setup
    const chart = LightweightCharts.createChart(document.getElementById("chart"), {
      layout: { backgroundColor: '#0a0a0a', textColor: '#ccc' },
      grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
      priceScale: { borderColor: '#555' },
      timeScale: { borderColor: '#555', timeVisible: true, secondsVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries();

    let ws = null;
    let currentInterval = '15m';

    // ---------------------------------------------------------------------
    // Data sources. A = Binance (hosts tried in parallel). B = CryptoCompare,
    // used automatically when Binance can't be reached on this network.
    // ---------------------------------------------------------------------
    const BASE = symbol.replace(/usdt$/, '').toUpperCase();
    const REST_HOSTS = [
      'https://data-api.binance.vision',
      'https://api.binance.com',
      'https://api1.binance.com',
      'https://api.binance.us'
    ];
    const WS_HOSTS = [
      'wss://data-stream.binance.vision',
      'wss://stream.binance.com:9443'
    ];
    let wsHostIndex = 0, wsFails = 0, binanceDown = false, pollTimer = null, lastCandle = null;

    function fmtPrice(n) {
      n = Number(n);
      if (!isFinite(n)) return '--';
      if (n >= 1000) return n.toFixed(2);
      if (n >= 1) return n.toFixed(4);
      if (n >= 0.01) return n.toFixed(5);
      return n.toFixed(8);
    }

    // fetch with timeout so a blocked host can't hang forever
    function fetchJson(url, ms = 6000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { signal: ctrl.signal })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .finally(() => clearTimeout(timer));
    }

    const CC_MAP = {
      '15m': { ep: 'histominute', agg: 15 },
      '30m': { ep: 'histominute', agg: 30 },
      '1h':  { ep: 'histohour',   agg: 1 },
      '12h': { ep: 'histohour',   agg: 12 },
      '1d':  { ep: 'histoday',    agg: 1 }
    };

    // Candles from Binance, or CryptoCompare if Binance is unreachable / pair not listed
    async function getKlines(interval, limit) {
      if (!binanceDown) {
        try {
          const data = await Promise.any(REST_HOSTS.map(h =>
            fetchJson(`${h}/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=${interval}&limit=${limit}`, 6000)));
          if (Array.isArray(data) && data.length) {
            return data.map(c => ({
              time: c[0] / 1000,
              open: parseFloat(c[1]), high: parseFloat(c[2]),
              low: parseFloat(c[3]),  close: parseFloat(c[4])
            }));
          }
        } catch (e) {
          console.warn('Binance unreachable for candles, using CryptoCompare', e);
        }
        binanceDown = true;
      }
      const m = CC_MAP[interval];
      const j = await fetchJson(
        `https://min-api.cryptocompare.com/data/v2/${m.ep}?fsym=${BASE}&tsym=USD&limit=${Math.min(limit, 2000)}&aggregate=${m.agg}`, 12000);
      if (j.Response === 'Error') throw new Error(j.Message);
      return j.Data.Data.filter(c => c.close > 0).map(c => ({
        time: c.time, open: c.open, high: c.high, low: c.low, close: c.close
      }));
    }

    function showChartError(msg) {
      document.getElementById("chart").insertAdjacentHTML('afterbegin',
        `<div id="chartError" style="position:absolute;padding:20px;color:#ff6b6b;z-index:5">${msg}</div>`);
    }

    async function loadChartData(interval) {
      const old = document.getElementById('chartError');
      if (old) old.remove();
      try {
        const formatted = await getKlines(interval, 1000);
        if (!formatted.length) throw new Error('No candle data');
        candleSeries.setData(formatted);
        chart.timeScale().fitContent();
        lastCandle = formatted[formatted.length - 1];
        document.getElementById("price").textContent = `$${fmtPrice(lastCandle.close)}`;
      } catch (err) {
        console.error('Chart load error:', err);
        showChartError('Could not load chart data for this coin from any source.');
        document.getElementById("price").textContent = 'Unavailable';
      }
    }

    // Price label + keep the last candle moving
    function applyPrice(p) {
      document.getElementById("price").textContent = `$${fmtPrice(p)}`;
      if (lastCandle) {
        lastCandle = { ...lastCandle, close: p, high: Math.max(lastCandle.high, p), low: Math.min(lastCandle.low, p) };
        candleSeries.update(lastCandle);
      }
    }

    // Polling fallback when the WebSocket can't connect
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
    function startPolling() {
      if (pollTimer) return;
      const tick = async () => {
        try {
          if (!binanceDown) {
            const j = await Promise.any(REST_HOSTS.map(h =>
              fetchJson(`${h}/api/v3/ticker/price?symbol=${symbol.toUpperCase()}`, 5000)));
            applyPrice(parseFloat(j.price));
            return;
          }
        } catch (e) { /* fall through to CryptoCompare */ }
        try {
          const j = await fetchJson(`https://min-api.cryptocompare.com/data/price?fsym=${BASE}&tsyms=USD`, 8000);
          if (j.USD) applyPrice(j.USD);
        } catch (e) { console.warn('Price poll failed', e); }
      };
      tick();
      pollTimer = setInterval(tick, 5000);
    }

    function startWebSocket(interval) {
      if (ws) {
        ws.onclose = null; // intentional close - don't auto-reconnect the old stream
        ws.close();
        ws = null;
      }
      if (binanceDown || wsFails >= 3) { startPolling(); return; }
      ws = new WebSocket(`${WS_HOSTS[wsHostIndex % WS_HOSTS.length]}/ws/${symbol}@kline_${interval}`);
      ws.onopen = () => { wsFails = 0; stopPolling(); };
      ws.onmessage = event => {
        const data = JSON.parse(event.data).k;
        const candle = {
          time: data.t / 1000,
          open: parseFloat(data.o),
          high: parseFloat(data.h),
          low: parseFloat(data.l),
          close: parseFloat(data.c)
        };
        lastCandle = candle;
        candleSeries.update(candle);
        document.getElementById("price").textContent = `$${fmtPrice(candle.close)}`;
      };
      ws.onerror = () => ws.close();
      ws.onclose = () => {
        wsFails++;
        wsHostIndex++;
        if (wsFails >= 3) { startPolling(); return; }
        setTimeout(() => startWebSocket(currentInterval), 2000);
      };
    }

    // Keep chart sized to its container (otherwise it can stay 0px / wrong width)
    function resizeChart() {
      const el = document.getElementById("chart");
      chart.resize(el.clientWidth, el.clientHeight);
    }
    window.addEventListener('resize', resizeChart);
    resizeChart();

    function changeTimeframe(interval) {
      currentInterval = interval;
      document.querySelectorAll('.timeframe-buttons button').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.timeframe-buttons button[onclick="changeTimeframe('${interval}')"]`).classList.add('active');
      loadChartData(interval);
      startWebSocket(interval);
    }

    function placeOrder() {
      const amount = parseFloat(document.getElementById("usdtAmount").value);
      const action = document.getElementById("tradeAction").value;
      const priceText = document.getElementById("price").textContent.replace("$", "");
      const price = parseFloat(priceText);

      if (!email) {
        document.getElementById("tradeResult").textContent = "Please log in first to place an order.";
        return;
      }

      if (!amount || !price || amount <= 0) {
        document.getElementById("tradeResult").textContent = "Please enter a valid amount.";
        return;
      }

      const coinAmount = amount / price;
      const feeRate = action === 'buy' ? 0.005 : 0.01;
      const fee = coinAmount * feeRate;
      const netCoins = action === 'buy' ? (coinAmount - fee) : (coinAmount);
      const netUSDT = action === 'sell' ? (coinAmount * price - fee * price) : amount;

      document.getElementById("tradeResult").innerHTML = `
        You will <strong>${action}</strong> <strong>${netCoins.toFixed(6)}</strong> ${tradeData.name}<br>
        ${action === 'buy' ? 'Total USDT spent:' : 'Total USDT received:'} <strong>$${netUSDT.toFixed(2)}</strong><br>
        Fee charged: <strong>${fee.toFixed(6)} ${tradeData.name}</strong>
      `;

      // TODO: Send transaction to PHP to record in MySQL
fetch("trade.php", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    email: email,
    coin: tradeData.name,
    type: action,
    quantity: netCoins,
    price_per_unit: price,
    fee: fee,
  }),
})
.then(res => res.text())
.then(msg => {
  console.log(msg);
  alert(msg);
})
.catch(err => console.error("Trade error:", err));


    }



    // Initial load
    loadChartData(currentInterval);
    startWebSocket(currentInterval);









// --- Get ATH / ATL (Binance, or CryptoCompare if Binance is unreachable) ---
getKlines('1d', 1000)
  .then(data => {
    const lows = data.map(c => c.low);
    const highs = data.map(c => c.high);

    const atl = Math.min(...lows);
    const ath = Math.max(...highs);

    document.getElementById("atl").textContent = "$" + fmtPrice(atl);
    document.getElementById("ath").textContent = "$" + fmtPrice(ath);
  })
  .catch(err => {
    console.error("Error computing ATH/ATL:", err);
    document.getElementById("atl").textContent = "N/A";
    document.getElementById("ath").textContent = "N/A";
  });



  // Extract base symbol if symbol is pair like BTCUSDT
let baseSymbol = symbol;
if (symbol.endsWith('usdt')) {
  baseSymbol = symbol.replace('usdt', '');
}

const coinGeckoIds = {
  btc: 'bitcoin',
  eth: 'ethereum',
  bnb: 'binancecoin',
  xrp: 'ripple',
  sol: 'solana',
  ada: 'cardano',
  doge: 'dogecoin',
  ton: 'the-open-network', // TON is the ticker for The Open Network
  ltc: 'litecoin',
  dot: 'polkadot',
  sui: 'sui',
  trx: 'tron',
  avax: 'avalanche-2',
  uni: 'uniswap',
  link: 'chainlink',
  slf: 'slf', // Assuming SLF is the ticker
  trump: 'magacoin', // TRUMP is often used as a ticker for MAGA
  wc: 'walletconnect', // Assuming WC for WalletConnect
  wif: 'dogwifhat', // WIF is the common ticker for DogWifHat
  nexp: 'nexpace', // Assuming NEXP for NexPace
  sandt: 'space-and-time', // Assuming S&T for Space and Time, simplified to sandt for key
  nexo: 'nexo',
  solv: 'solv-protocol', // Assuming SOLV for Solv Protocol
  trb: 'tellor', // TRB is the ticker for Tellor Tributes
  pha: 'phala-network', // PHA is the ticker for Phala Network
  aip: 'act-i-the-ai-prophecy', // Assuming AIP for Act I: The AI Prophecy
  pnut: 'peanut-the-squirrel', // Assuming PNUT for Peanut the Squirrel
  algo: 'algorand',
  fil: 'filecoin',
  qtum: 'qtum',
  vana: 'vana', // Assuming VANA is the ticker
  op: 'optimism',
  jup: 'jupiter-ag',
  lumi: 'lumia', // Assuming LUMI for Lumia
  init: 'initia', // Assuming INIT for Initia
  portal: 'portal',
  cati: 'catizen', // Assuming CATI for Catizen
  bmap: 'bubblemaps', // Assuming BMAP for Bubblemaps
  flm: 'flamingo-finance', // FLM is the ticker for Flamingo
  mantra: 'mantra-dao', // MANTRA is often used as the ticker
  santos: 'santos-fc-fan-token', // SANTOS is the ticker
  alpine: 'alpine-f1-team-fan-token', // ALPINE is the ticker
  four: 'four-pillars', // FOUR is often used as the ticker
  super: 'superverse', // SUPER is the ticker
  epic: 'epic-chain', // Assuming EPIC for Epic Chain
  zec: 'zcash',
  dash: 'dash',
  dcr: 'decred',
  ksm: 'kusama',
  aave: 'aave',
  wbet: 'wrapped-beacon-eth', // Assuming WBET for Wrapped Beacon ETH
  wld: 'worldcoin-wld',
  tao: 'bittensor', // TAO is the ticker for Bittensor
  apt: 'aptos',
  near: 'near',
  icp: 'internet-computer',
  arb: 'arbitrum',
  rndr: 'render-token',
  virt: 'virtuals-protocol', // Assuming VIRT for Virtuals Protocol
  celestia: 'celestia', // TIA is the ticker but name is Celestia, using full for consistency
  ena: 'ethena',
  atom: 'cosmos',
  mk: 'maker', // MK is the ticker for Maker (MKR)
  bsol: 'binance-staked-sol', // Assuming BSOL for Binance Staked SOL

  pendle: 'pendle',

  rune: 'thorchain', // RUNE is the ticker for ThorChain
  axs: 'axie-infinity',
  ethfi: 'ether-fi', // ETHFI is the ticker for Ether.Fi
  xtz: 'tezos',
  neo: 'neo',
  flow: 'flow',
  lz: 'layerzero', // Assuming LZ for LayerZero
  ape: 'apecoin',
  kaito: 'kaito', // Kaito often uses Kaito as ticker
  egld: 'elrond-egld', // EGLD is the ticker for MultiversX (formerly Elrond)
  comp: 'compound-governance-token', // COMP is the ticker for Compound
  gno: 'gnosis',
  lpt: 'livepeer',
  mask: 'mask-network',
  sfp: 'safepal',
  snx: 'synthetix-network-token',
  solay: 'solayer', // Assuming SOLAY for SoLayer
  gas: 'gas',
  ordi: 'ordi',
  yfi: 'yearn-finance',
  orca: 'orca',
  gmx: 'gmx',
  nano: 'nano',
  ilv: 'illuvium',
  metis: 'metis-token',
  ssv: 'ssv-network',
  auction: 'auction',
  gns: 'gains-network', // GNS is the ticker for Gains Network
  psg: 'paris-saint-germain-fan-token', // PSG is the ticker
  scroll: 'scroll', // SCRL might be a ticker, but Scroll is often used
  movr: 'moonriver',
  ntrn: 'neutron',
};

const coinId = coinGeckoIds[baseSymbol.toLowerCase()] || 'bitcoin';

// Market cap / supply: CryptoCompare first (matched by ticker, so always the right coin),
// CoinGecko as backup.
fetchJson(`https://min-api.cryptocompare.com/data/pricemultifull?fsyms=${BASE}&tsyms=USD`, 10000)
  .then(j => {
    const d = j.RAW[BASE].USD;
    if (!d || !d.MKTCAP) throw new Error('no market cap');
    document.getElementById("marketCap").textContent = "$" + Number(d.MKTCAP).toLocaleString();
    document.getElementById("supply").textContent = Number(d.SUPPLY).toLocaleString() + " " + BASE;
  })
  .catch(() => fetchJson(`https://api.coingecko.com/api/v3/coins/${coinId}`, 10000)
    .then(data => {
      document.getElementById("marketCap").textContent = "$" + data.market_data.market_cap.usd.toLocaleString();
      document.getElementById("supply").textContent = data.market_data.circulating_supply.toLocaleString() + " " + data.symbol.toUpperCase();
    }))
  .catch(err => {
    console.error("Failed to fetch Market Cap / Supply:", err);
    document.getElementById("marketCap").textContent = "N/A";
    document.getElementById("supply").textContent = "N/A";
  });




  </script>
</body>
</html>
