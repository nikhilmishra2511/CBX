<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CBX - Customer Support</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.3);
    }

    .support-content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeInUp 1s ease-out forwards;
    }

    h1 {
      color: #00ffc8;
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    .label {
      color: #ccc;
    }

    .value {
      color: #00ffc8;
      font-weight: bold;
    }

    .back-btn {
      margin-top: 30px;
      padding: 12px 24px;
      background: linear-gradient(to right, #00ffc8, #00bfa5);
      border: none;
      border-radius: 8px;
      color: #0a0a0a;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #00ffc8;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="bg-video">
    <source src="bg.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Support Info -->
  <div class="support-content">
    <h1>Contact Support</h1>
    <p><span class="label">Email:</span> <span class="value">Nikhilmishra2511@gmail.com</span></p>
    <p><span class="label">Contact Number:</span> <span class="value">+91 9426838430</span></p>
    <button class="back-btn" onclick="goBack()">Back to Home</button>
  </div>

  <script>
    function goBack() {
      window.location.href = "../main.html";
    }
  </script>

</body>
</html>
